services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TRADING_HOST: 0.0.0.0
      TRADING_DATA_PATH: /app/server/data/trading.sqlite
    volumes:
      - ledger:/app/server/data
    expose: ["4190"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4190/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 45s
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WORKER_DOMAIN: ${WORKER_DOMAIN:?Set WORKER_DOMAIN in deploy/.env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
      - proxy_config:/config
    depends_on: [worker]
volumes:
  ledger:
  tls:
  proxy_config:
